# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: AgroVision
email:
description: >- # this means to ignore newlines until "baseurl:"
  AgroVision: Leveraging Remote Sensing and AI for Agriculture, a project funded by ESA.
twitter_username:
github_username: agrovision
minimal_mistakes_skin: default
search: false

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes@4.28.0
# Outputting
permalink: /:categories/:title/
paginate: 5   # amount of posts to show
paginate_path: /page:num/
timezone: Europe/Amsterdam 

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

logo: "/assets/logos/agrovision.jpeg"
author:
  name   : "AgroVision"
  avatar   : "/assets/logos/agrovision.jpeg"
  bio    : "AgroVision: Leveraging Remote Sensing and AI for precision agriculture."
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://stemauro.github.io/agrovision.github.io"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/stemauro/agrofusion/tree/v0.1.0"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/stemauro/agrofusion/tree/v0.1.0"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/